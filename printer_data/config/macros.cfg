#=====================================================
# START PRINT
#=====================================================

[gcode_macro START_PRINT]
description: Heat, home, mesh, park and purge
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    {% set FULL_MESH = params.FULL_MESH|default(0)|int %}

    CLEAR_PAUSE
    G90
    M107

    # Begin heating
    M140 S{BED_TEMP}
    M104 S150

    # Home XY while heating
    G28 X Y

    # Stabilize at probing temperatures
    M190 S{BED_TEMP}
    M109 S150

    # Home Z with the bed hot
    G28 Z

    BED_MESH_CLEAR

    # FULL_MESH=1 is useful for diagnostics.
    # Normal prints default to a fresh adaptive mesh.
    {% if FULL_MESH == 1 %}
        BED_MESH_CALIBRATE ADAPTIVE=0
    {% else %}
        BED_MESH_CALIBRATE ADAPTIVE=1
    {% endif %}

    # Heat at a safe location near the print
    SMART_PARK
    M109 S{EXTRUDER_TEMP}

    # Prime the nozzle
    LINE_PURGE


#=====================================================
# END PRINT
#=====================================================

[gcode_macro END_PRINT]
description: Safely finish and present the print
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set current_z = printer.toolhead.position.z|float %}
    {% set requested_lift = 10.0 %}

    {% if current_z < (max_z - requested_lift) %}
        {% set safe_lift = requested_lift %}
    {% else %}
        {% set safe_lift = max_z - current_z %}
    {% endif %}

    RESPOND MSG="Print finished"
    M400

    {% if printer.extruder.can_extrude|lower == 'true' %}
        M83
        G1 E-0.8 F1800
    {% endif %}

    {% if "xyz" in printer.toolhead.homed_axes %}
        G91
        G1 Z{safe_lift} F300
        G90
        G1 X5 Y220 F6000
    {% endif %}

    M107
    TURN_OFF_HEATERS
    BED_MESH_CLEAR
    CLEAR_PAUSE

    # Motors are left enabled until idle_timeout.
    # This helps avoid immediately losing dual-Z alignment.


#=====================================================
# PARK PRINTER
#=====================================================

[gcode_macro M125]
description: Park the toolhead
gcode:
    {% set x = params.X|default(5)|float %}
    {% set y = params.Y|default(225)|float %}
    {% set requested_lift = params.Z|default(10)|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set current_z = printer.toolhead.position.z|float %}

    {% if current_z < (max_z - requested_lift) %}
        {% set safe_lift = requested_lift %}
    {% else %}
        {% set safe_lift = max_z - current_z %}
    {% endif %}

    {% if "xyz" in printer.toolhead.homed_axes %}
        SAVE_GCODE_STATE NAME=M125_state
        G91
        G1 Z{safe_lift} F300
        G90
        G1 X{x} Y{y} F6000
        RESTORE_GCODE_STATE NAME=M125_state
    {% else %}
        RESPOND TYPE=error MSG="Printer is not homed"
    {% endif %}


#=====================================================
# LOAD FILAMENT
#=====================================================

[gcode_macro LOAD_FILAMENT]
description: Load filament through the Sprite Pro
gcode:
    {% set fast_length = params.FAST|default(35)|float %}
    {% set purge_length = params.PURGE|default(10)|float %}

    {% if printer.extruder.can_extrude|lower == 'true' %}
        SAVE_GCODE_STATE NAME=load_filament_state
        M83
        G92 E0
        G1 E{fast_length} F600
        G1 E{purge_length} F120
        G92 E0
        RESTORE_GCODE_STATE NAME=load_filament_state
    {% else %}
        RESPOND TYPE=error MSG="Heat the nozzle before loading filament"
    {% endif %}


#=====================================================
# UNLOAD FILAMENT
#=====================================================

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament from the Sprite Pro
gcode:
    {% if printer.extruder.can_extrude|lower == 'true' %}
        SAVE_GCODE_STATE NAME=unload_filament_state
        M83
        G92 E0

        # Form the filament tip, then withdraw it
        G1 E5 F300
        G1 E-15 F1800
        G1 E-45 F600

        G92 E0
        RESTORE_GCODE_STATE NAME=unload_filament_state
    {% else %}
        RESPOND TYPE=error MSG="Heat the nozzle before unloading filament"
    {% endif %}


#=====================================================
# FILAMENT CHANGE
#=====================================================

[gcode_macro M600]
description: Pause and unload filament
gcode:
    PAUSE
    UNLOAD_FILAMENT

[gcode_macro FILAMENT_CHANGE]
description: Alias for M600
gcode:
    M600


#=====================================================
# PAUSE
#=====================================================

[gcode_macro PAUSE]
description: Pause and park the print
rename_existing: PAUSE_BASE
gcode:
    {% set x = params.X|default(5)|float %}
    {% set y = params.Y|default(225)|float %}
    {% set requested_lift = params.Z|default(10)|float %}
    {% set retract = params.E|default(1)|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set current_z = printer.toolhead.position.z|float %}

    {% if current_z < (max_z - requested_lift) %}
        {% set safe_lift = requested_lift %}
    {% else %}
        {% set safe_lift = max_z - current_z %}
    {% endif %}

    PAUSE_BASE
    G91

    {% if printer.extruder.can_extrude|lower == 'true' %}
        G1 E-{retract} F2100
    {% else %}
        RESPOND MSG="Extruder not hot enough to retract"
    {% endif %}

    {% if "xyz" in printer.toolhead.homed_axes %}
        G1 Z{safe_lift} F300
        G90
        G1 X{x} Y{y} F6000
    {% else %}
        G90
        RESPOND TYPE=error MSG="Printer is not homed"
    {% endif %}


#=====================================================
# RESUME
#=====================================================

[gcode_macro RESUME]
description: Resume the paused print
rename_existing: RESUME_BASE
gcode:
    {% set prime = params.E|default(1)|float %}

    {% if 'VELOCITY' in params %}
        {% set resume_params = "VELOCITY=" + params.VELOCITY %}
    {% else %}
        {% set resume_params = "" %}
    {% endif %}

    {% if printer.extruder.can_extrude|lower == 'true' %}
        G91
        G1 E{prime} F2100
        RESUME_BASE {resume_params}
    {% else %}
        RESPOND TYPE=error MSG="Heat the nozzle before resuming"
    {% endif %}


#=====================================================
# CANCEL PRINT
#=====================================================

[gcode_macro CANCEL_PRINT]
description: Safely cancel the current print
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set current_z = printer.toolhead.position.z|float %}
    {% set requested_lift = 10.0 %}

    {% if current_z < (max_z - requested_lift) %}
        {% set safe_lift = requested_lift %}
    {% else %}
        {% set safe_lift = max_z - current_z %}
    {% endif %}

    {% if printer.extruder.can_extrude|lower == 'true' %}
        M83
        G1 E-0.8 F1800
    {% endif %}

    {% if "xyz" in printer.toolhead.homed_axes %}
        G91
        G1 Z{safe_lift} F300
        G90
        G1 X5 Y220 F6000
    {% endif %}

    M107
    TURN_OFF_HEATERS
    BED_MESH_CLEAR
    CLEAR_PAUSE
    BASE_CANCEL_PRINT